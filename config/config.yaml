# Toutes les valeurs de seuil sont des HYPOTHESES non calibrées (status: hypothese)
# tant que le journal de sorties compte moins de 20 entrées.

center:
  name: Montpellier
  lat: 43.6108
  lon: 3.8767

grid:
  radius_km: 60          # approximation haversine du "<= 1 h" (remplacé en phase 2c)
  spacing_km: 5

terrain:
  spacing_m: 250          # maille habitat (phase 2a+) ; la météo reste à grid.spacing_km

timeline:                 # curseur temporel de la carte (phase 3, avancé le 2026-11-04)
  days_before: 7          # J-7 : rétrospectif, météo = analyses du modèle, pas des observations
  days_after: 7           # J+7 : prévision, fiabilité décroissante au-delà de ~J+3

availability:             # utilisé par le rapport (phase 3)
  days: [saturday, sunday, holiday, weekday_evening]
  weekday_depart_hour: 17.0
  max_travel_minutes: 60
  min_forage_minutes: 60  # hypothèse : durée minimale utile de cueillette avec la lumière du jour

access:                   # phase 2c (calcul unique : `python -m radar access`)
  # Départ = centre ci-dessus, SAUF si RADAR_HOME_LAT / RADAR_HOME_LON sont définis (fichier .env local ou
  # secrets GitHub) : jamais d'adresse personnelle dans ce fichier (dépôt public).
  osrm_url: https://router.project-osrm.org   # serveur de démonstration OSRM : usage modéré, 1 requête/s max
  sample_km: 2            # échantillonnage des temps de trajet (interpolés ensuite sur les cellules 250 m)
  batch: 100              # destinations par requête
  pause_seconds: 1.2
  walk_kmh: 4.0           # du point d'échantillon à la route la plus proche : à pied
  protected:
    wfs_url: https://data.geopf.fr/wfs/ows   # Géoplateforme IGN, couches PatriNat (MNHN/OFB)
    # factor : multiplicateur du score dans la zone. 0 = exclu par prudence (la cueillette y est souvent
    # interdite, mais c'est le règlement de CHAQUE site qui fait foi) ; 1 = signalé seulement.
    layers:
      rnn: {typename: "patrinat_rnn:rnn", factor: 0.0, label: "Réserve naturelle nationale"}
      rnr: {typename: "patrinat_rnr:rnr", factor: 0.0, label: "Réserve naturelle régionale"}
      apb: {typename: "patrinat_apb:apb", factor: 0.0, label: "Arrêté de protection de biotope"}
      pn_coeur: {typename: "patrinat_pn:parc_national", where: {zone: "Cœur"}, factor: 1.0,
                 label: "Cœur du Parc national des Cévennes (cueillette réglementée)"}

weather:
  api_url: https://api.open-meteo.com/v1/forecast
  past_days: 40           # 30 j d'historique nécessaires au score + 7 j de curseur rétrospectif (+ marge)
  forecast_days: 11       # J..J+10 : le score de J+7 a besoin de 3 j de prévision après lui
  batch_size: 50          # points par requête
  pause_seconds: 1.5      # pause entre lots
  max_retries: 4
  max_points_per_day: 2000   # garde-fou quota (limite gratuite ~10000 appels/jour)
  cache_dir: data/cache

score:
  status: hypothese
  floor: 0.05             # plancher par composante (évite l'effondrement à 0)
  weights:
    pluie: 0.30
    delai: 0.25
    temp: 0.20
    secheresse: 0.15
    prevision: 0.10
  pluie:
    trigger_mm: 20        # pluie déclenchante cumulée sur 2 jours
    lookback_days: 15
    zero_below_mm: 10
    plateau_from_mm: 20
    plateau_to_mm: 60
    saturation_mm: 150
    saturation_value: 0.5
  delai:                  # jours depuis la pluie déclenchante (lookback 30 j)
    zero_before: 4
    plateau_from: 8
    plateau_to: 14
    zero_after: 35
    lookback_days: 30
  temp:
    ideal_tmin: 8.0
    zero_tmin: 3.0
    window_days: 7
  secheresse:
    ok_mm_per_day: 1.0    # >= ce débit moyen depuis la pluie : pas de pénalité
    min_value: 0.4
  prevision:
    horizon_days: 3
    ok_from_mm: 5
    ok_to_mm: 40
    dry_value: 0.85
    wet_mm: 80
    wet_value: 0.8
  gel:
    window_days: 7
    frost_tmin: 0.0
    severe_tmin: -4.0
    penalty_per_night: 0.25
    altitude_threshold_m: 800
    altitude_multiplier: 1.5
    floor: 0.2
    severe_factor: 0.1
  classes:                # bornes sur le score 0-100
    faible: 0
    moyen: 35
    bon: 55
    tres_bon: 75
  # exposants du score final (phase 2b). habitat 1,0 (et non 0,4) : décision du 2026-11-04, sinon une cellule
  # à 10 % d'habitat garde 40 % du score (garrigue pelée « moyen » après une bonne pluie).
  exponent_meteo: 0.6
  exponent_habitat: 1.0

calibration:
  min_sorties: 20         # sous ce seuil : affichage "indice non calibré"
