# Toutes les valeurs de seuil sont des HYPOTHESES non calibrées (status: hypothese)
# tant que le journal de sorties compte moins de 20 entrées.

center:
  name: Montpellier
  lat: 43.6108
  lon: 3.8767

grid:
  radius_km: 60          # approximation haversine du "<= 1 h" (remplacé en phase 2c)
  spacing_km: 5

terrain:
  spacing_m: 250          # maille habitat (phase 2a+) ; la météo reste à grid.spacing_km

timeline:                 # curseur temporel de la carte (phase 3, avancé le 2026-11-04)
  days_before: 7          # J-7 : rétrospectif, météo = analyses du modèle, pas des observations
  days_after: 7           # J+7 : prévision, fiabilité décroissante au-delà de ~J+3

availability:             # utilisé par le rapport (phase 3)
  days: [saturday, sunday, holiday, weekday_evening]
  weekday_depart_hour: 17.0
  max_travel_minutes: 75  # 60 -> 75 le 2026-11-07 : les meilleures zones à cèpes (Cévennes) étaient à 61-70 min
  min_forage_minutes: 60  # hypothèse : durée minimale utile de cueillette avec la lumière du jour

access:                   # phase 2c (calcul unique : `python -m radar access`)
  # Départ = centre ci-dessus, SAUF si RADAR_HOME_LAT / RADAR_HOME_LON sont définis (fichier .env local ou
  # secrets GitHub) : jamais d'adresse personnelle dans ce fichier (dépôt public).
  osrm_url: https://router.project-osrm.org   # serveur de démonstration OSRM : usage modéré, 1 requête/s max
  sample_km: 2            # échantillonnage des temps de trajet (interpolés ensuite sur les cellules 250 m)
  batch: 100              # destinations par requête
  pause_seconds: 1.2
  walk_kmh: 4.0           # du point d'échantillon à la route la plus proche : à pied
  protected:
    wfs_url: https://data.geopf.fr/wfs/ows   # Géoplateforme IGN, couches PatriNat (MNHN/OFB)
    # factor : multiplicateur du score dans la zone. 0 = exclu par prudence (la cueillette y est souvent
    # interdite, mais c'est le règlement de CHAQUE site qui fait foi) ; 1 = signalé seulement.
    layers:
      rnn: {typename: "patrinat_rnn:rnn", factor: 0.0, label: "Réserve naturelle nationale"}
      rnr: {typename: "patrinat_rnr:rnr", factor: 0.0, label: "Réserve naturelle régionale"}
      apb: {typename: "patrinat_apb:apb", factor: 0.0, label: "Arrêté de protection de biotope"}
      pn_coeur: {typename: "patrinat_pn:parc_national", where: {zone: "Cœur"}, factor: 1.0,
                 label: "Cœur du Parc national des Cévennes (cueillette réglementée)"}

weather:
  api_url: https://api.open-meteo.com/v1/forecast
  past_days: 40           # 30 j d'historique nécessaires au score + 7 j de curseur rétrospectif (+ marge)
  forecast_days: 11       # J..J+10 : le score de J+7 a besoin de 3 j de prévision après lui
  batch_size: 50          # points par requête
  pause_seconds: 1.5      # pause entre lots
  max_retries: 4
  # Modèle principal Météo-France (AROME 1,3 km + ARPEGE), choisi le 2026-11-07 d'après `controle-pluie` sur
  # 44 stations et 90 jours : cumul modèle/observé 0,98 (best_match : 0,66), pluies déclenchantes vues 81 %
  # (64 %), erreur sur le score météo 6,7 pts (12,0). Il ne prévoit que jusqu'à J+3 : au-delà, et pour tout jour
  # sans valeur, complément par fallback_model (best_match). Les jours J+4..J+10 restent donc moins fiables.
  model: meteofrance_seamless
  fallback_model: best_match
  max_points_per_day: 4000   # garde-fou quota (deux modèles par point ; limite gratuite ~10000 appels/jour)
  cache_dir: data/cache

score:
  status: hypothese
  floor: 0.05             # plancher par composante (évite l'effondrement à 0)
  weights:
    pluie: 0.30
    delai: 0.25
    temp: 0.20
    secheresse: 0.15
    prevision: 0.10
  pluie:
    trigger_mm: 20        # pluie déclenchante cumulée sur 2 jours
    lookback_days: 15
    zero_below_mm: 10
    plateau_from_mm: 20
    plateau_to_mm: 60
    saturation_mm: 150
    saturation_value: 0.5
  delai:                  # jours depuis la pluie déclenchante (lookback 30 j)
    zero_before: 4
    plateau_from: 8
    plateau_to: 14
    zero_after: 35
    lookback_days: 30
    # Enchaînement des pluies (2026-11-08) : montée comptée depuis le début de la poussée, déclin depuis la
    # dernière pluie qui l'entretient.
    reset_mm: 50          # cumul 2 j >= : forte pluie, NOUVELLE poussée ; en dessous, une pluie pendant une
                          # poussée active (<= plateau_to j après sa dernière pluie) la PROLONGE
    damaged_factor: 0.5   # après une forte pluie, la poussée précédente (gorgée d'eau, limaces) garde la moitié
                          # de son score météo tant que c'est mieux que la nouvelle
  temp:
    ideal_tmin: 8.0
    zero_tmin: 3.0
    window_days: 7
  secheresse:             # le sol est-il resté humide ? (score.soil_ratio)
    # Bilan d'eau quotidien d'une réserve de surface (litière + premiers cm) : W = min(W + pluie, capacité)
    # − coef × ET0 (évapotranspiration de référence Open-Meteo, gazon ; coef < 1 sous couvert forestier).
    bucket_mm: 40         # capacité de la réserve
    et_coef: 0.7
    init_ratio: 0.5       # état de départ (oublié après quelques semaines de série)
    dry_ratio: 0.10       # réserve <= 10 % : composante au minimum
    wet_ratio: 0.50       # réserve >= 50 % : pas de pénalité
    min_value: 0.4
    ok_mm_per_day: 1.0    # REPLI sans ET0 : pluie moyenne/jour depuis la pluie déclenchante (ancienne mesure)
  prevision:
    horizon_days: 3
    ok_from_mm: 5
    ok_to_mm: 40
    dry_value: 0.85
    wet_mm: 80
    wet_value: 0.8
  gel:
    window_days: 7
    frost_tmin: 0.0
    severe_tmin: -4.0
    penalty_per_night: 0.25
    altitude_threshold_m: 800
    altitude_multiplier: 1.5
    floor: 0.2
    severe_factor: 0.1
  classes:                # bornes sur le score 0-100
    faible: 0
    moyen: 35
    bon: 55
    tres_bon: 75
  # exposants du score final (phase 2b). habitat 1,0 (et non 0,4) : décision du 2026-11-04, sinon une cellule
  # à 10 % d'habitat garde 40 % du score (garrigue pelée « moyen » après une bonne pluie).
  exponent_meteo: 0.6
  exponent_habitat: 1.0

report:                   # phase 3 : `python -m radar report [--send]`
  horizon_days: 7         # créneaux de J à J+7
  top_n: 3                # zones par famille et par jour
  min_separation_km: 5    # deux zones proposées sont distantes d'au moins ça
  hunting_months: [9, 10, 11, 12, 1, 2]   # rappel « chasse » (période générale ; arrêtés départementaux à vérifier)
  # Destinataire et SMTP : UNIQUEMENT .env local / secrets GitHub (REPORT_TO, SMTP_HOST, SMTP_PORT, SMTP_USER,
  # SMTP_PASSWORD, REPORT_FROM). Jamais ici : dépôt public.

observations:             # contrôle de la pluie modèle : `python -m radar controle-pluie`
  # Données climatologiques de base quotidiennes, Météo-France (data.gouv.fr, dataset 6569b51ae64326786e4e8e1a,
  # Licence Ouverte 2.0). Fichier « latest » par département, mis à jour avec ~2 jours de retard (vérifié le
  # 2026-11-07 : 28 stations avec pluie dans l'Hérault, données jusqu'à J-2).
  # L'URL du fichier change chaque année (latest-2025-2026, puis 2026-2027…) : elle est lue dans le catalogue
  # data.gouv ; le gabarit ne sert qu'en secours. Seuls les hôtes de allowed_hosts sont téléchargés.
  catalog_url: https://www.data.gouv.fr/api/1/datasets/6569b51ae64326786e4e8e1a/
  url_template: https://meteofrance.s3.sbg.io.cloud.ovh.net/data/synchro_ftp/BASE/QUOT/Q_{dep}_latest-2025-2026_RR-T-Vent.csv.gz
  allowed_hosts: [meteofrance.s3.sbg.io.cloud.ovh.net, object.files.data.gouv.fr]
  departements: ["34", "30"]
  dir: data/raw/obs
  max_age_hours: 20       # au-delà, on retélécharge
  max_size_mb: 20         # garde-fou (le fichier fait ~0,6 Mo)
  # prévisions archivées des modèles (testée le 2026-11-07 : 91 jours complets, best_match et meteofrance_seamless)
  model_api_url: https://historical-forecast-api.open-meteo.com/v1/forecast
  days: 90                # fenêtre comparée, terminée au dernier jour de relevés
  radius_km: 70           # stations retenues autour du centre
  min_days: 30            # une station avec moins de jours communs est ignorée
  event_tolerance_days: 1 # une pluie déclenchante est « vue » si le modèle la place à ±1 jour

calibration:
  min_sorties: 20         # sous ce seuil : affichage "indice non calibré"
